name: Android CI/CD

on:
  push:
    # 推送 v* 标签时触发：跑单测 -> 打 debug 包 -> 发布到 GitHub Release
    tags:
      - "v*"

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest

    - name: Build debug APK
      run: ./gradlew assembleDebug

    - id: apk
      name: Rename APK with version
      run: |
        VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
        APK="BiliDownOut-${VERSION}-debug.apk"
        cp app/build/outputs/apk/debug/app-debug.apk "$APK"
        echo "path=$APK" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Generate release notes from tag message
      run: |
        git tag -l --format='%(contents)' "${GITHUB_REF}" > release_notes.md
        cat release_notes.md

    - name: Upload APK to GitHub Release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ steps.apk.outputs.path }}
        asset_name: ${{ steps.apk.outputs.path }}
        tag: ${{ github.ref }}
        release_name: ${{ github.ref_name }}
        overwrite: true
        body_path: release_notes.md
